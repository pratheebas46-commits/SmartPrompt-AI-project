services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartprompt_ai
      POSTGRES_USER: smartprompt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartprompt -d smartprompt_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EXECUTION_MODE: online
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg2://smartprompt:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/smartprompt_ai
      CORS_ALLOWED_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
      AI_PROVIDER: ${AI_PROVIDER:-local}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENABLE_FILE_LOGGING: "false"
      MAX_UPLOAD_SIZE_MB: 50
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      EXECUTION_MODE: online
      API_BASE_URL: http://backend:8000
      STREAMLIT_HOST: 0.0.0.0
      STREAMLIT_PORT: 8501
    ports:
      - "8501:8501"

volumes:
  postgres_data:
