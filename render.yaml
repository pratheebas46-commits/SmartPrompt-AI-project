# Render Blueprint for SmartPrompt AI (Free / Low-Cost Online Deployment)
services:
  - type: web
    name: smartprompt-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_api.py
    healthCheckPath: /health
    envVars:
      - key: EXECUTION_MODE
        value: online
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: ENABLE_FILE_LOGGING
        value: "false"
      - key: AI_PROVIDER
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: smartprompt-ai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: smartprompt-ai-frontend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_app.py
    envVars:
      - key: EXECUTION_MODE
        value: online
      - key: STREAMLIT_HOST
        value: 0.0.0.0
      - key: API_BASE_URL
        sync: false

databases:
  - name: smartprompt-ai-db
    plan: free
    databaseName: smartprompt_ai
    user: smartprompt
